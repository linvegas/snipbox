{{define "title"}}Create a New Snippet{{end}}

{{define "main"}}
    <form action="/snippet/create" method="POST">
        <section>
            <label>Title:</label>
            {{with .Form.FieldErrors.title}}
                <label class="error">{{.}}</label>
            {{end}}
            <input type="text" max="100" name="title" value="{{.Form.Title}}" required>
        </section>
        <section>
            <label>Content:</label>
            {{with .Form.FieldErrors.content}}
                <label class="error">{{.}}</label>
            {{end}}
            <textarea name="content" required>{{.Form.Content}}</textarea>
        </section>
        <section>
            <label>Delete in:</label>
            {{with .Form.FieldErrors.expires}}
                <label class="error">{{.}}</label>
            {{end}}
            <input type="radio" id="delete1" name="expires" value="365" {{if (eq .Form.Expires 365)}}checked{{end}}>
            <label for="delete1">One year</label>
            <input type="radio" id="delete2" name="expires" value="7" {{if (eq .Form.Expires 7)}}checked{{end}}>
            <label for="delete2">One week</label>
            <input type="radio" id="delete3" name="expires" value="1" {{if (eq .Form.Expires 1)}}checked{{end}}>
            <label for="delete3">One day</label>
        </section>
        <section>
            <input type="submit" value="Publish snippet">
        </section>
    </form>
{{end}}
